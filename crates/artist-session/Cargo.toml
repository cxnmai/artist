[package]
name = "artist-session"
version = "0.1.0"
edition = "2024"

[dependencies]
artist-core = { path = "../artist-core" }
dirs = "6"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
turso = { version = "=0.8.3", default-features = false }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["time"] }

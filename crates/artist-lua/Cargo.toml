[package]
name = "artist-lua"
version = "0.1.0"
edition = "2024"

[dependencies]
artist-core = { path = "../artist-core" }
artist-model = { path = "../artist-model" }
artist-tools = { path = "../artist-tools" }
mlua = { version = "0.11", features = ["lua54", "vendored", "async", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
